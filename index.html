<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Road to Portugal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header>
            <h1>Road to Portugal 🇵🇹</h1>
            <p>Complete each step and move closer to Portugal.</p>
        </header>

        <section class="journey">

            <div class="route">
                <span>🏠</span>
                <span>📋</span>
                <span>💷</span>
                <span>✈️</span>
                <span>🇵🇹</span>
            </div>

            <div id="traveller" class="traveller">
                🧍
            </div>

            <p id="progressText">0% complete</p>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </section>

        <section class="tasks">

            <h2>Portugal checklist</h2>

            <label class="task">
                <input type="checkbox">
                Check passport expiry date
            </label>

            <label class="task">
                <input type="checkbox">
                Create a moving budget
            </label>

            <label class="task">
                <input type="checkbox">
                Research areas to live
            </label>

            <label class="task">
                <input type="checkbox">
                Research visa requirements
            </label>

            <label class="task">
                <input type="checkbox">
                Arrange accommodation
            </label>

            <label class="task">
                <input type="checkbox">
                Book flights
            </label>

        </section>

        <p id="message" class="message">
            Your Portugal journey starts here!
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
